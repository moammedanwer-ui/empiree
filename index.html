<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EMPIRE SPORT — How to Order</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-teal: #083335;
      --deep-black: #010A0B;
      --pure-white: #FFFFFF;
      --accent-gold: #E6C387;
      --font-main: 'Cairo', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: var(--font-main);
      color: var(--pure-white);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Exact 9:16 Mobile Stage for Reels */
    .mobile-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 430px;
      max-height: 932px;
      aspect-ratio: 9 / 16;
      background: radial-gradient(circle at 50% 45%, #0d4648 0%, var(--primary-teal) 55%, var(--deep-black) 100%);
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 70px 20px 40px 20px;
    }

    @media (min-width: 500px) and (min-height: 800px) {
      .mobile-stage {
        width: 430px;
        height: 764px;
        border-radius: 32px;
        border: 2px solid rgba(255, 255, 255, 0.15);
      }
    }

    /* Dynamic Particles Canvas */
    .bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Texture & Vignette Overlay */
    .texture-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 50% 50%, transparent 35%, rgba(0,0,0,0.85) 100%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      z-index: 2;
      pointer-events: none;
    }

    /* Top Bar */
    .top-bar {
      position: absolute;
      top: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .brand-mini-tag {
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      opacity: 0.9;
    }

    /* Header Section */
    .order-header {
      z-index: 10;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      margin-top: 10px;
    }

    .order-header.show {
      opacity: 1;
      transform: translateY(0);
    }

    .order-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .order-title {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    }

    /* Order Steps Container */
    .steps-container {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: auto 0;
    }

    .step-card {
      position: relative;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      padding: 16px 14px;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: right;
      opacity: 0;
      transform: translateY(25px) scale(0.96);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .step-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .step-number {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--accent-gold);
      flex-shrink: 0;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 900;
      color: var(--pure-white);
      margin-bottom: 2px;
      line-height: 1.2;
    }

    .step-desc {
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.8;
      line-height: 1.4;
    }

    /* Contact Links Section */
    .contact-buttons-box {
      z-index: 10;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .contact-buttons-box.show {
      opacity: 1;
      transform: translateY(0);
    }

    .contact-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.03) 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 30px;
      text-decoration: none;
      color: var(--pure-white);
      backdrop-filter: blur(10px);
      transition: transform 0.2s ease;
    }

    .contact-btn:active {
      transform: scale(0.97);
    }

    .btn-left-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon-svg {
      width: 24px;
      height: 24px;
      fill: #FFFFFF;
    }

    .btn-text {
      font-size: 0.95rem;
      font-weight: 900;
    }

    .btn-badge {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <script>
    /* Canvas Particles Background */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.3;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.opacity = Math.random() * 0.5 + 0.1;
      }
      update() {
        this.y += this.speedY;
        if (this.y < 0) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    /* Sequential Animation Controller */
    let timers = [];

    function addTimer(fn, delay) {
      timers.push(setTimeout(fn, delay));
    }

    function startAnimation() {
      timers.forEach(t => clearTimeout(t));
      timers = [];

      document.getElementById('orderHeader').classList.remove('show');
      document.getElementById('step1').classList.remove('show');
      document.getElementById('step2').classList.remove('show');
      document.getElementById('step3').classList.remove('show');
      document.getElementById('contactBtns').classList.remove('show');

      addTimer(() => document.getElementById('orderHeader').classList.add('show'), 300);
      addTimer(() => document.getElementById('step1').classList.add('show'), 900);
      addTimer(() => document.getElementById('step2').classList.add('show'), 1600);
      addTimer(() => document.getElementById('step3').classList.add('show'), 2300);
      addTimer(() => document.getElementById('contactBtns').classList.add('show'), 3000);

      // Loop after display for easy recording
      addTimer(() => startAnimation(), 9000);
    }

    window.addEventListener('DOMContentLoaded', startAnimation);
  </script>
</body>
</html>
